[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "undiscovered"
version = "0.1.0"
description = "Lend your computer to undiscovered: map which fields of science cite each other, with your own free OpenAlex allowance."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
undiscovered = "undiscovered.cli:main"

[project.urls]
Homepage = "https://nicolas-maman.github.io/undiscovered/"
Source = "https://github.com/nicolas-maman/undiscovered"

[tool.setuptools]
packages = ["undiscovered"]
