name: intake

# Checks each submitted map result and stores the accepted records on the
# map-2025 branch. One run at a time, so two results never race on the index.
on:
  issues:
    types: [opened]

concurrency:
  group: map-intake
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  map:
    if: startsWith(github.event.issue.title, 'map result u-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: map-2025
          path: map
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests jsonschema
      - name: Check the result
        env:
          MAP_DIR: map
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/intake.py | tail -n 1 > verdict.json
      - name: Store what was accepted
        run: |
          cd map
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Accept map result from issue #${{ github.event.issue.number }}"
            git push -q
          fi
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python -c "import json; v = json.load(open('verdict.json')); open('reply.txt', 'w').write(v['reply'])"
          label=$(python -c "import json; print('work-result' if json.load(open('verdict.json'))['accepted'] else 'invalid')")
          gh issue comment "$NUMBER" --body-file reply.txt
          gh issue edit "$NUMBER" --add-label "$label"
          gh issue close "$NUMBER"
