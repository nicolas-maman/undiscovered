name: intake

# Checks each submitted result and stores what is accepted: map results on
# the map-2025 branch, describing (distill) results on distill-2025.
#
# There is no concurrency group: GitHub keeps only one run waiting per group
# and cancels the others, which would drop results when several arrive at
# once. Runs go in parallel instead, and pipeline/intake_job.sh starts again
# from the branch as it is whenever another run pushed first. The sweep
# workflow picks up any result issue left unanswered.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  map:
    if: startsWith(github.event.issue.title, 'map result u-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: map-2025
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests jsonschema
      - name: Check the result and store it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/intake_job.sh map
      - name: Reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/reply.sh "${{ github.event.issue.number }}"

  distill:
    if: startsWith(github.event.issue.title, 'distill result u-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: distill-2025
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (the client's own checks are the ones applied)
        run: pip install requests jsonschema numpy scikit-learn ./clients/python
      - name: Check the result, store it, and combine everything accepted so far
        run: bash pipeline/intake_job.sh distill
      - name: Reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash pipeline/reply.sh "${{ github.event.issue.number }}"
