name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no ML stack needed for the offline tests)
        run: pip install requests numpy scikit-learn pytest
      - name: Offline tests
        working-directory: research
        run: python -m pytest -q
      - name: Schemas are valid JSON
        run: python -c "import json,glob; [json.load(open(p)) for p in glob.glob('schemas/*.json')]; print('ok')"
      - name: Plain punctuation (no em or en dashes in project text)
        run: python scripts/check_punctuation.py
