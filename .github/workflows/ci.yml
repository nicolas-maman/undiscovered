name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no ML stack needed for the offline tests)
        run: pip install requests numpy scikit-learn jsonschema pytest
      - name: Offline tests
        working-directory: research
        run: python -m pytest -q
      - name: Client tests (the client must agree with the research code)
        run: |
          pip install -e clients/python
          python -m pytest -q clients/python/tests
      - name: Intake tests (checking submitted results)
        run: python -m pytest -q pipeline/tests
      - name: Protocol examples point at real OpenAlex records
        working-directory: research
        env:
          UNDISCOVERED_ONLINE: "1"
        run: python -m pytest -q tests/test_protocol.py
      - name: Schemas are valid JSON
        run: python -c "import json,glob; [json.load(open(p)) for p in glob.glob('schemas/*.json')]; print('ok')"
      - name: Plain punctuation (no em or en dashes in project text)
        run: python scripts/check_punctuation.py
      - name: Links within the project point at files and headings that exist
        run: python scripts/check_links.py

  # The describing intake workflow's own commands, on a valid result for the
  # first open unit of the live branch, without pushing anything: a broken
  # workflow shows here before a volunteer's result meets it.
  intake-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: distill-2025
          path: distill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install, as the intake workflow does
        run: pip install requests jsonschema numpy scikit-learn ./clients/python
      - name: A result, checked, combined and scored, as the intake workflow does
        env:
          DISTILL_DIR: distill
          INTAKE_EVENT: event.json
        run: |
          python scripts/rehearse_intake.py distill event.json
          python pipeline/intake.py | tail -n 1 > verdict.json
          python -c "import json, sys; v = json.load(open('verdict.json')); print(v['reply']); sys.exit(0 if v['accepted'] else 1)"
          python pipeline/combine.py distill
          python pipeline/known_twins.py result distill
          python -c "import json; p = json.load(open('distill/progress.json')); assert p['descriptions'] == 20, p"

  # The Aether client on Linux, where its non-Windows parts (priority, hidden
  # input, settings path) are compiled and tested. The toolchain is built from
  # the pinned release once and cached under that tag.
  aether-client:
    runs-on: ubuntu-latest
    env:
      AETHER_REF: v0.805.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Aether toolchain
        uses: actions/cache@v4
        with:
          path: ~/.aether
          key: aether-${{ runner.os }}-${{ env.AETHER_REF }}
      - name: Install the Aether toolchain
        run: |
          if [ ! -x "$HOME/.aether/bin/ae" ]; then
            git clone --depth 1 --branch "$AETHER_REF" https://github.com/aether-lang-dev/aether.git "$RUNNER_TEMP/aether"
            (cd "$RUNNER_TEMP/aether" && ./install.sh)
          fi
          echo "$HOME/.aether/bin" >> "$GITHUB_PATH"
      - name: Build and test the client
        working-directory: clients/aether
        run: |
          ae build src/main.ae -o undiscovered
          ae test tests/test_client.ae
          ae test tests/test_distill.ae
          ./undiscovered --version
