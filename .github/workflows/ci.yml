name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no ML stack needed for the offline tests)
        run: pip install requests numpy scikit-learn jsonschema pytest
      - name: Offline tests
        working-directory: research
        run: python -m pytest -q
      - name: Client tests (the client must agree with the research code)
        run: |
          pip install -e clients/python
          python -m pytest -q clients/python/tests
      - name: Intake tests (checking submitted results)
        run: python -m pytest -q pipeline/tests
      - name: Protocol examples point at real OpenAlex records
        working-directory: research
        env:
          UNDISCOVERED_ONLINE: "1"
        run: python -m pytest -q tests/test_protocol.py
      - name: Schemas are valid JSON
        run: python -c "import json,glob; [json.load(open(p)) for p in glob.glob('schemas/*.json')]; print('ok')"
      - name: Plain punctuation (no em or en dashes in project text)
        run: python scripts/check_punctuation.py
